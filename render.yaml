# Render Blueprint: one click deploy of API + Postgres. See docs/08-cloud-deploy.md
# The API refuses to start in production until the secrets marked `sync: false` are set in the Render dashboard.
services:
  - type: web
    name: datashield-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: datashield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY       # Fernet key; generate and back it up yourself (see docs/08)
        sync: false
      - key: BLIND_INDEX_KEY      # random 32+ chars; never change it once users exist
        sync: false
      - key: OTP_SENDER
        value: smtp
      - key: REMOVAL_SENDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REMOVAL_REPLY_TO
        sync: false
      - key: FORWARDED_ALLOW_IPS  # Render's proxy sits in front, so trust X-Forwarded-For for rate limiting
        value: "*"
  # Worker that sends queued removal letters and escalates overdue ones. Render cron jobs are a paid plan,
  # so it is commented out; enable it (or run `python -m app.worker` from any scheduler) once SMTP works.
  # - type: cron
  #   name: datashield-worker
  #   runtime: docker
  #   plan: starter
  #   schedule: "17 */6 * * *"
  #   dockerCommand: python -m app.worker
  #   envVars: (same as the API service)
databases:
  - name: datashield-db
    plan: free
